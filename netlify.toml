[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "pdfkit"]
  included_files = ["public/app.html", "lib/assets/DejaVuSans.ttf", "lib/assets/FONT_LICENSE.txt", "lib/assets/supabase-prod-ca-2021.crt", "lib/assets/supabase-prod-ca-2025.crt", "lib/assets/SUPABASE_CLI_LICENSE.txt"]
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/app.html"
  to = "/.netlify/functions/api/app.html"
  status = 200
  force = true
[[redirects]]
  from = "/app"
  to = "/.netlify/functions/api/app.html"
  status = 200
  force = true
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

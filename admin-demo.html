<a class=\"brand\" href=\"#dashboard\"><span class=\"logo\">CR</span><span>COUR DE RENFORCEMENT<small>SCOLAIRE</small></span></a><a href=\"/\" style=\"color:#dce9e7;font-size:12px;margin-top:24px\">← Retour à l’accueil</a><div class=\"school-label\">ESPACE DE GESTION</div><nav id=\"nav\"></nav><div class=\"sidebar-bottom\"><span class=\"status-dot\"></span> Année scolaire 2026 – 2027<p>Apprendre. Progresser. Réussir.</p></div></aside><main><header><div><span class=\"eyebrow\">VOTRE ÉTABLISSEMENT, EN UN COUP D’ŒIL</span><h1 id=\"title\">Tableau de bord</h1></div><div class=\"profile\" hidden><label for=\"role\">Espace de démonstration</label><select id=\"role\"><option value=\"admin\">Administration</option><option value=\"teacher\">Enseignant</option><option value=\"student\">Élève</option></select><select id=\"identity\" aria-label=\"Profil de démonstration\"></select></div></header><div class=\"demo\">Administration · Version de démonstration · Données enregistrées dans ce navigateur · Page administrateur de démonstration, sans connexion sécurisée. Aucun encaissement réel.</div><section id=\"content\"></section><footer>COUR DE RENFORCEMENT SCOLAIRE <span>Chaque progrès compte.</span></footer></main><dialog id=\"modal\"><form id=\"form\"><div class=\"dialog-head\"><h2 id=\"modal-title\"></h2><button type=\"button\" id=\"close\" class=\"icon-button\" aria-label=\"Fermer\">×</button></div><div id=\"fields\"></div><p id=\"error\" role=\"alert\"></p><button class=\"primary\" type=\"submit\">Enregistrer</button></form></dialog><div id=\"toast\" role=\"status\"></div", "js": "'use strict';\nconst key='crs-demo-v2';\nconst seed={students:[],teachers:[],courses:[],attendance:[],payments:[],grades:[]};\nlet db;try{db=JSON.parse(window.demoStorage.getItem(key))||JSON.parse(JSON.stringify(seed))}catch{db=JSON.parse(JSON.stringify(seed))}\ntry{const pending=JSON.parse(window.demoStorage.getItem('crs-preinscriptions-v2')||'[]');if(pending.length){for(const s of pending)if(!db.students.some(x=>x.id===s.id))db.students.push(s);window.demoStorage.setItem(key,JSON.stringify(db));window.demoStorage.removeItem('crs-preinscriptions-v2')}}catch{}\nlet role='admin',identity='',page='dashboard',search='';\nconst $=id=>document.getElementById(id);\nconst esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst student=id=>db.students.find(s=>s.id===id);const course=id=>db.courses.find(c=>c.id===id);const teacher=id=>db.teachers.find(t=>t.id===id);\nconst money=n=>new Intl.NumberFormat('fr-FR').format(n)+' FCFA';const date=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});\nconst sections={dashboard:['◈','Tableau de bord'],students:['♙','Élèves'],teachers:['♧','Enseignants'],courses:['▦','Cours & planning'],attendance:['✓','Présences'],payments:['◇','Paiements'],grades:['▤','Notes & résultats']};\nconst visibleCourses=()=>db.courses.filter(c=>role==='admin'||(role==='teacher'?c.teacher===identity:c.group===student(identity)?.group));\nconst visibleStudents=()=>db.students.filter(s=>role==='admin'||(role==='student'?s.id===identity:visibleCourses().some(c=>c.group===s.group)));\nfunction toast(message){$('toast').textContent=message;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}\nfunction save(){try{window.demoStorage.setItem(key,JSON.stringify(db));return true}catch{toast('Stockage indisponible : les changements ne sont pas sauvegardés.');return false}}\nfunction identityOptions(){const list=role==='teacher'?db.teachers:role==='student'?db.students:[];$('identity').hidden=!list.length;$('identity').innerHTML=list.map(x=>`<option value=\"${esc(x.id)}\">${esc(x.name)}</option>`).join('');identity=list[0]?.id||''}\nfunction navigation(){let entries=Object.keys(sections).filter(x=>role==='admin'||!['teachers','students'].includes(x)&&!(role==='teacher'&&x==='payments'));$('nav').innerHTML=entries.map(x=>`<button data-page=\"${x}\" class=\"${page===x?'active':''}\"><span>${sections[x][0]}</span>${sections[x][1]}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;search='';render()})}\nfunction table(headers,rows){return rows.length?`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class=\"empty\">Aucune donnée à afficher.</div>'}\nfunction person(s){return `<span class=\"avatar\">${esc(s.name.split(' ').map(p=>p[0]).slice(0,2).join(''))}</span>${esc(s.name)}`}\nfunction panel(title,subtitle,body){return `<div class=\"panel\"><div class=\"panel-head\"><div><h2>${title}</h2><p>${subtitle}</p></div></div>${body}</div>`}\nfunction dashboard(){const students=visibleStudents(),courses=visibleCourses();const grades=db.grades.filter(g=>students.some(s=>s.id===g.student)&&courses.some(c=>c.id===g.course));const average=grades.length?(grades.reduce((s,g)=>s+Number(g.score),0)/grades.length).toFixed(1):'—';const payments=db.payments.filter(p=>students.some(s=>s.id===p.student));const future=courses.filter(c=>c.date>=new Date().toLocaleDateString('en-CA')).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const stats=role==='teacher'?[['Élèves accompagnés',students.length,'Dans vos groupes'],['Cours planifiés',courses.length,'Toutes les séances'],['Moyenne des notes',average+' / 20','Évaluations enregistrées'],['Présences saisies',db.attendance.filter(a=>courses.some(c=>c.id===a.course)).length,'Statuts renseignés']]:[['Élèves inscrits',students.length,role==='student'?'Votre dossier':'Tous les groupes'],['Cours planifiés',courses.length,'Toutes les séances'],['Encaissements simulés',money(payments.reduce((s,p)=>s+Number(p.amount),0)),'Démonstration · aucun argent réel'],['Moyenne des notes',average+' / 20','Évaluations enregistrées']];return `<div class=\"welcome\"><div><h2>${role==='admin'?'Un nouvel élan pour la réussite.':'Bienvenue, '+esc((role==='teacher'?teacher(identity):student(identity))?.name||'')+'.'}</h2><p>${role==='admin'?'Organisez les cours, accompagnez les élèves et suivez leurs progrès.<br>Tout votre établissement dans un seul espace.':'Retrouvez vos cours et suivez les progrès, séance après séance.'}</p></div><div class=\"art\">✧</div></div><div class=\"stats\">${stats.map(s=>`<div class=\"stat\"><span class=\"stat-label\">${s[0]}</span><strong>${s[1]}</strong><small>${s[2]}</small></div>`).join('')}</div><div class=\"columns\">${panel('Prochaines séances','Le planning des cours de renforcement',future.length?future.slice(0,5).map(c=>`<div class=\"lesson\"><div class=\"lesson-time\">${esc(c.time)}</div><div><strong>${esc(c.subject)}</strong><p>${date(c.date)} · ${esc(c.group)}</p><span class=\"badge\">${esc(c.room)} · ${c.duration} min</span></div></div>`).join(''):'<div class=\"empty\">Aucune séance à venir.</div>')}${panel(role==='student'?'Mon parcours':'Les groupes','Des cours adaptés à chaque niveau',[...new Set(students.map(s=>s.group))].map(g=>`<div class=\"lesson\"><div><strong>${esc(g)}</strong><p>${students.filter(s=>s.group===g).length} élève(s) · ${courses.filter(c=>c.group===g).length} séance(s)</p></div></div>`).join('')+'<p class=\"helper\">Les montants sont affichés en FCFA. Les paiements saisis constituent un suivi administratif, sans transaction en ligne.</p>')}</div>`}\nconst addLabels={students:'Inscrire un élève',teachers:'Ajouter un enseignant',courses:'Planifier un cours',payments:'Enregistrer un paiement',grades:'Ajouter une note'};\nfunction canAdd(){return role==='admin'&&page!=='attendance'||role==='teacher'&&page==='grades'}\nfunction rowsForPage(){let rows=[];if(page==='students')rows=db.students.filter(s=>(s.name+' '+s.group).toLowerCase().includes(search)).map(s=>`<tr><td>${person(s)}</td><td>${esc(s.class)}</td><td><span class=\"badge\">${esc(s.centre||s.group)}</span></td><td>${esc(s.registrationStatus||'Inscrit (démo)')}</td><td>${actions(s.id)}</td></tr>`);if(page==='teachers')rows=db.teachers.filter(t=>(t.name+' '+t.subject).toLowerCase().includes(search)).map(t=>`<tr><td>${person(t)}</td><td>${esc(t.subject)}</td><td>${db.courses.filter(c=>c.teacher===t.id).length} séance(s)</td><td>${actions(t.id)}</td></tr>`);if(page==='courses')rows=visibleCourses().filter(c=>(c.subject+' '+c.group).toLowerCase().includes(search)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(c=>`<tr><td><strong>${esc(c.subject)}</strong></td><td>${esc(c.group)}</td><td>${esc(teacher(c.teacher)?.name||'—')}</td><td>${date(c.date)} · ${esc(c.time)}</td><td>${esc(c.room)} · ${c.duration} min</td>${role==='admin'?`<td>${actions(c.id)}</td>`:''}</tr>`);if(page==='payments')rows=db.payments.filter(p=>visibleStudents().some(s=>s.id===p.student)&&(student(p.student)?.name+' '+p.period).toLowerCase().includes(search)).map(p=>`<tr><td>${esc(student(p.student)?.name)}</td><td>${esc(p.period)}</td><td>${money(p.amount)}</td><td>${date(p.date)}</td><td><span class=\"badge\">Enregistré</span></td>${role==='admin'?`<td>${actions(p.id)}</td>`:''}</tr>`);if(page==='grades')rows=db.grades.filter(g=>visibleStudents().some(s=>s.id===g.student)&&visibleCourses().some(c=>c.id===g.course)&&(student(g.student)?.name+' '+g.label+' '+course(g.course)?.subject).toLowerCase().includes(search)).map(g=>`<tr><td>${esc(student(g.student)?.name)}</td><td>${esc(course(g.course)?.subject)}</td><td>${esc(g.label)}</td><td><span class=\"badge ${g.score<10?'orange':''}\">${g.score} / 20</span></td>${role!=='student'?`<td>${actions(g.id)}</td>`:''}</tr>`);return rows}\nfunction actions(id){return `<div class=\"row-actions\"><button class=\"secondary\" data-edit=\"${esc(id)}\">Modifier</button><button class=\"secondary danger\" data-delete=\"${esc(id)}\">Supprimer</button></div>`}\nfunction list(){let headers={students:['Élève','Classe','Centre / Groupe','Statut','Actions'],teachers:['Enseignant','Matière','Cours','Actions'],courses:['Matière','Groupe','Enseignant',

# This blueprint provisions a PAID service and persistent disk.
# Review Render pricing before applying; this file does not deploy anything.
services:
  - type: web
    name: cours-renforcement-scolaire
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: donnees-etablissement
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRS_DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: CRS_SETUP_TOKEN
        generateValue: true
      - key: KKIAPAY_SANDBOX
        value: "true"
